<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Login | Optimal Management Consultancy</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body style="min-height: 100vh; background: linear-gradient(135deg, var(--wine-deep) 0%, var(--wine) 60%, var(--wine-dark) 100%); display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0; background-image: radial-gradient(circle at 1px 1px, rgba(201,168,76,0.07) 1px, transparent 0); background-size: 44px 44px; pointer-events: none;"></div>
  <div style="position: absolute; top: -15%; right: -10%; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(201,168,76,0.1) 0%, transparent 70%); pointer-events: none;"></div>

  <div style="background: rgba(255,255,255,0.06); backdrop-filter: blur(24px); border: 1px solid rgba(201,168,76,0.25); border-radius: 16px; padding: 3rem; width: 100%; maxWidth: 420px; position: relative; z-index: 2;">
    <!-- Logo -->
    <div style="text-align: center; margin-bottom: 2.5rem;">
      <div style="width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 1rem; background: linear-gradient(135deg, var(--gold-dark), var(--gold-light)); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; color: var(--wine-deep); font-family: 'Playfair Display', serif; box-shadow: 0 8px 30px rgba(201,168,76,0.4);">
        O
      </div>
      <h1 style="color: var(--white); font-weight: 700; font-size: 1.4rem; margin-bottom: 0.25rem;">Admin Portal</h1>
      <p style="color: rgba(255,255,255,0.45); font-size: 0.82rem;">Optimal Management Consultancy</p>
    </div>

    <form id="login-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
      <div>
        <label style="color: rgba(255,255,255,0.6); font-size: 0.78rem; display: block; margin-bottom: 0.4rem;">Email Address</label>
        <input class="form-input" type="email" id="admin-email" placeholder="admin@optimalconsult.com.ng" required />
      </div>

      <div>
        <label style="color: rgba(255,255,255,0.6); font-size: 0.78rem; display: block; margin-bottom: 0.4rem;">Password</label>
        <input class="form-input" type="password" id="admin-password" placeholder="••••••••" required />
      </div>

      <div id="login-error" style="display: none; background: rgba(255,107,107,0.12); border: 1px solid rgba(255,107,107,0.3); border-radius: 6px; padding: 0.75rem 1rem; color: #ff6b6b; font-size: 0.85rem;"></div>

      <button type="submit" id="admin-login-btn" class="btn-gold" style="width: 100%; justify-content: center; padding: 1rem; font-size: 0.95rem; margin-top: 0.5rem;">
        🔐 Sign In to Dashboard
      </button>
    </form>

    <a href="index.html" style="display: block; text-align: center; margin-top: 1.75rem; color: rgba(255,255,255,0.4); font-size: 0.82rem; text-decoration: none; transition: color 0.3s;"
       onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='rgba(255,255,255,0.4)'">
      ← Back to Website
    </a>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAuth(true); // redirect if already authenticated
      handleLogin();
    });
  </script>
</body>
</html>
